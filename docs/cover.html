<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NOIR Drive — Cover</title>
<!--
  Interim README / social cover: the real storefront screenshots in CSS device frames.
  Uses cover-laptop.png (1512x982 @2x homepage) and cover-phone.png (390x844 @3x booking).
  Render the .cover element (1600x900) at 2x, e.g. with puppeteer, to cover.png.
  Swap for a photographic scene once scripts/image-generation/noir_drive_cover_prompts.json
  has been generated (composite with composite_screens.py).
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050505; }
  .cover {
    width: 1600px; height: 900px; position: relative; overflow: hidden;
    background:
      radial-gradient(60% 55% at 50% 42%, rgba(200,169,107,0.20) 0%, rgba(200,169,107,0.05) 45%, rgba(5,5,5,0) 70%),
      linear-gradient(180deg, #0B0B0C 0%, #050505 100%);
  }
  .ghost {
    position: absolute; top: 40px; left: 0; right: 0; text-align: center;
    font: 800 230px/1 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-stretch: 125%;
    letter-spacing: 0.08em; color: transparent; -webkit-text-stroke: 1px rgba(200,169,107,0.16);
  }
  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 190px;
    background: linear-gradient(180deg, rgba(200,169,107,0) 0%, rgba(200,169,107,0.06) 100%);
    border-top: 1px solid rgba(200,169,107,0.18);
  }
  /* Laptop */
  .laptop { position: absolute; left: 230px; top: 150px; width: 1060px; }
  .lid {
    background: #111113; border-radius: 22px 22px 6px 6px; padding: 22px 22px 30px;
    box-shadow: 0 0 0 1.5px #2a2a2e inset, 0 40px 120px rgba(0,0,0,0.75), 0 0 80px rgba(200,169,107,0.10);
    position: relative;
  }
  .lid::before { content: ''; position: absolute; top: 9px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #222; }
  .screen { aspect-ratio: 1512 / 982; overflow: hidden; border-radius: 4px; background: #000; }
  .screen img, .phone-screen img { width: 100%; display: block; }
  .base {
    height: 22px; margin: 0 -70px; border-radius: 0 0 26px 26px;
    background: linear-gradient(180deg, #3a3a3e 0%, #1c1c1f 55%, #0d0d0f 100%);
    box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    position: relative;
  }
  .base::before { content: ''; position: absolute; top: 0; left: 50%; width: 160px; margin-left: -80px; height: 9px; border-radius: 0 0 10px 10px; background: #141416; }
  /* Phone */
  .phone {
    position: absolute; right: 190px; top: 260px; width: 300px;
    background: #0d0d0f; border-radius: 52px; padding: 12px;
    box-shadow: 0 0 0 1.5px #2e2e33 inset, 0 0 0 4px #1b1b1e, 0 50px 110px rgba(0,0,0,0.85), 0 0 60px rgba(200,169,107,0.10);
  }
  .phone-screen { aspect-ratio: 390 / 844; overflow: hidden; border-radius: 41px; position: relative; background: #050505; padding-top: 44px; }
  .phone-screen::after { content: ''; position: absolute; top: 11px; left: 50%; width: 92px; height: 27px; margin-left: -46px; border-radius: 20px; background: #000; }
</style>
</head>
<body>
<div class="cover">
  <div class="ghost">NOIR</div>
  <div class="floor"></div>
  <div class="laptop">
    <div class="lid"><div class="screen"><img src="cover-laptop.png" alt=""></div></div>
    <div class="base"></div>
  </div>
  <div class="phone"><div class="phone-screen"><img src="cover-phone.png" alt=""></div></div>
</div>
</body>
</html>
